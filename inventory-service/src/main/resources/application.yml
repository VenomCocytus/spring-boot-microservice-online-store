spring:
  application:
    name: inventory-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/inventory_service
    username: root
    password: mysql
  # To do all the migration using flyway
  jpa:
    hibernate:
      ddl-auto: none

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

service-data:
  info:
    title: Inventory Service API
    description: This service provides endpoints for managing inventories.
    version: 0.0.1
    license:
      name: MIT License
      url: https://opensource.org/licenses/MIT
    contact:
      name: Allan Elong - Software Engineer - Content Creator
      url: https://github.com/VenomCocytus
  external-documentation:
    description: Find more info about our inventory service.
    url: https://github.com/VenomCocytus/spring-boot-microservice-online-store

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: inventory-service

server:
  port: 8082

loki:
  url: http://localhost:3100/loki/api/v1/push